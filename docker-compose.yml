services:
  integracao-controlid-poc:
    build:
      context: .
      dockerfile: Dockerfile
    image: integracao-controlid-poc:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_URLS: "http://+:8080"
      AllowedHosts: "${AllowedHosts:?set AllowedHosts in .env}"
      Host__ShutdownTimeoutSeconds: "${Host__ShutdownTimeoutSeconds:-30}"
      DataProtection__ApplicationName: "${DataProtection__ApplicationName:-Integracao.ControlID.PoC}"
      DataProtection__KeyPath: "${DataProtection__KeyPath:-/app/data/data-protection-keys}"
      DataProtection__CertificatePath: "/run/secrets/data-protection-certificate"
      DataProtection__CertificatePasswordFile: "/run/secrets/data-protection-certificate-password"
      ConnectionStrings__DefaultConnection: "${ConnectionStrings__DefaultConnection:-Data Source=/app/data/integracao_controlid.db}"
      Database__ApplyMigrationsOnStartup: "${Database__ApplyMigrationsOnStartup:-false}"
      Database__ExitAfterMigrations: "${Database__ExitAfterMigrations:-false}"
      Database__Encryption__RequireProtectedSensitiveColumns: "true"
      Database__Encryption__ProtectLegacyDataOnStartup: "false"
      Database__Encryption__RequireEncryptedVolume: "true"
      Database__Encryption__EncryptedVolumeAttested: "${Database__Encryption__EncryptedVolumeAttested:?attest encrypted storage in .env}"
      Security__RequireHttps: "true"
      Security__HttpsPort: "${Security__HttpsPort:-443}"
      ForwardedHeaders__Enabled: "${ForwardedHeaders__Enabled:-false}"
      ForwardedHeaders__ForwardLimit: "${ForwardedHeaders__ForwardLimit:-1}"
      ForwardedHeaders__KnownProxies__0: "${ForwardedHeaders__KnownProxies__0:-}"
      OpenApi__Enabled: "false"
      Observability__Metrics__Enabled: "${Observability__Metrics__Enabled:-true}"
      Observability__Metrics__AllowAnonymous: "false"
      Serilog__MinimumLevel__Default: "${Serilog__MinimumLevel__Default:-Information}"
      Serilog__WriteTo__1__Args__retainedFileCountLimit: "${Serilog__WriteTo__1__Args__retainedFileCountLimit:-14}"
      Serilog__WriteTo__1__Args__fileSizeLimitBytes: "${Serilog__WriteTo__1__Args__fileSizeLimitBytes:-10000000}"
      ControlIDApi__DefaultDeviceUrl: "${ControlIDApi__DefaultDeviceUrl:-}"
      ControlIDApi__DefaultUsername: "${ControlIDApi__DefaultUsername:-}"
      ControlIDApi__DefaultPassword: "${ControlIDApi__DefaultPassword:-}"
      ControlIDApi__ConnectionTimeoutSeconds: "${ControlIDApi__ConnectionTimeoutSeconds:-10}"
      ControlIDApi__MaxResponseBodyBytes: "${ControlIDApi__MaxResponseBodyBytes:-16777216}"
      ControlIDApi__RequireAllowedDeviceHosts: "true"
      ControlIDApi__RequireHttpsDeviceUrls: "true"
      ControlIDApi__AllowedDeviceHosts__0: "${ControlIDApi__AllowedDeviceHosts__0:?set ControlIDApi__AllowedDeviceHosts__0 in .env}"
      ControlIDApi__CircuitBreaker__Enabled: "${ControlIDApi__CircuitBreaker__Enabled:-true}"
      ControlIDApi__CircuitBreaker__FailureThreshold: "${ControlIDApi__CircuitBreaker__FailureThreshold:-5}"
      ControlIDApi__CircuitBreaker__BreakDurationSeconds: "${ControlIDApi__CircuitBreaker__BreakDurationSeconds:-30}"
      CallbackSecurity__MaxBodyBytes: "${CallbackSecurity__MaxBodyBytes:-1048576}"
      CallbackSecurity__MaxTrackedNonces: "${CallbackSecurity__MaxTrackedNonces:-10000}"
      CallbackSecurity__RequireSharedKey: "true"
      CallbackSecurity__SharedKey: "${CallbackSecurity__SharedKey:?set CallbackSecurity__SharedKey in .env}"
      CallbackSecurity__RequireSignedRequests: "true"
      CallbackSecurity__AllowLoopback: "false"
      CallbackSecurity__AllowedRemoteIps__0: "${CallbackSecurity__AllowedRemoteIps__0:-}"
    volumes:
      - controlid-data:/app/data
      - controlid-logs:/app/Logs
    secrets:
      - data-protection-certificate
      - data-protection-certificate-password
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  controlid-data:
  controlid-logs:

secrets:
  data-protection-certificate:
    file: "${DATA_PROTECTION_CERTIFICATE_FILE:?set DATA_PROTECTION_CERTIFICATE_FILE in .env}"
  data-protection-certificate-password:
    file: "${DATA_PROTECTION_CERTIFICATE_PASSWORD_FILE:?set DATA_PROTECTION_CERTIFICATE_PASSWORD_FILE in .env}"
